services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  # NOT published to the host: reachable only on the internal Docker network.
  # For ad-hoc debugging use: docker compose exec postgres psql ...
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-llm_eval}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Redis ───────────────────────────────────────────────────────────────────
  # NOT published to the host: reachable only on the internal Docker network.
  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Database Migrations (runs once per deployment, serialized) ─────────────
  # Application replicas MUST NOT run migrations concurrently at startup.
  # This one-shot service is the only place `alembic upgrade head` runs.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: sh -c "alembic upgrade head"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-llm_eval}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # ── FastAPI Application ─────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    # No migration here — see the `migrate` service. Safe to scale to N replicas.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers ${API_WORKERS:-2}
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-llm_eval}
      REDIS_URL: redis://redis:6379/0
      APP_ENV: production
      LOG_LEVEL: info
      CORS_ORIGINS: '["http://localhost:3000"]'
      PROMETHEUS_ENABLED: "true"
      OPENTELEMETRY_ENABLED: "${OPENTELEMETRY_ENABLED:-false}"
      OPENTELEMETRY_ENDPOINT: "${OPENTELEMETRY_ENDPOINT:-}"
      WORKER_CONCURRENCY: "${WORKER_CONCURRENCY:-2}"
      WORKER_MAX_RETRIES: "${WORKER_MAX_RETRIES:-3}"
      RATE_LIMIT_REQUESTS: "${RATE_LIMIT_REQUESTS:-100}"
      RATE_LIMIT_WINDOW: "${RATE_LIMIT_WINDOW:-60}"
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - hf_cache:/home/appuser/.cache/huggingface
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 180s
    restart: unless-stopped

  # ── Background Worker ──────────────────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: python -m app.worker
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-llm_eval}
      REDIS_URL: redis://redis:6379/0
      APP_ENV: production
      LOG_LEVEL: info
      WORKER_CONCURRENCY: "${WORKER_CONCURRENCY:-2}"
      WORKER_MAX_RETRIES: "${WORKER_MAX_RETRIES:-3}"
    volumes:
      - hf_cache:/home/appuser/.cache/huggingface
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── Prometheus ──────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
    restart: unless-stopped

  # ── Grafana ─────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    environment:
      # Required secret — deployment fails fast rather than starting with a known default.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?Set GRAFANA_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  hf_cache:
