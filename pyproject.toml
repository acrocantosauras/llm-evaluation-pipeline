[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-evaluation-pipeline"
version = "0.1.0"
description = "A modular framework for evaluating LLM responses: relevance, hallucination, latency, and cost."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Meet Jadhav" },
]
dependencies = [
    "numpy",
    "scipy",
    "tqdm",
    "psutil",
    "sentence-transformers>=2.2.2",
    "transformers>=4.35.0",
    "torch>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]
onnx = [
    "onnxruntime",
]

[project.scripts]
llm-eval = "main:main"

[tool.setuptools.packages.find]
include = ["evaluator*"]

[tool.setuptools.package-data]
evaluator = ["py.typed"]

# ── Ruff ──────────────────────────────────────────────────────────────────────

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["evaluator"]

# ── Pytest ────────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (require ML model downloads)",
]
