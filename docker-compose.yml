services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: llm_eval
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/llm_eval
      REDIS_URL: redis://redis:6379/0
      APP_ENV: development
      LOG_LEVEL: info
      # Dev-only convenience; never honored when APP_ENV=production/ci.
      ALLOW_DEV_AUTH_FALLBACK: "true"
    volumes:
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    user: appuser

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      sh -c "arq app.worker.WorkerSettings"
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/llm_eval
      REDIS_URL: redis://redis:6379/0
      APP_ENV: development
      LOG_LEVEL: info
      WORKER_CONCURRENCY: "2"
    volumes:
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    user: appuser

volumes:
  pgdata:
