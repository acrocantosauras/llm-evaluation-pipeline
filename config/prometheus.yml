global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "llm-eval-api"
    static_configs:
      - targets: ["api:8000"]
    metrics_path: "/metrics"
    scrape_interval: 10s

  - job_name: "llm-eval-worker"
    static_configs:
      - targets: ["worker:8000"]
    metrics_path: "/metrics"
    scrape_interval: 15s
    # The worker exposes job metrics via prometheus_client.start_http_server(8000)
    # in app/worker.py's startup hook.
